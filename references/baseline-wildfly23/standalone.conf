## -*- shell-script -*- ######################################################
##                                                                          ##
##  WildFly bootstrap Script Configuration                                    ##
##                                                                          ##
##############################################################################

# Specify the location of the Java home directory.  If set then $JAVA will
# be defined to $JAVA_HOME/bin/java, else $JAVA will be "java".
#
#JAVA_HOME="/opt/java/jdk"

if [ "x$JBOSS_MODULES_SYSTEM_PKGS" = "x" ]; then
   JBOSS_MODULES_SYSTEM_PKGS="org.jboss.byteman"
fi

JAVA_OPTS="-Djboss.socket.binding.port-offset=0 -Djboss.bind.address=0.0.0.0"

JAVA_OPTS="$JAVA_OPTS -Xms1024m -Xmx2048m"

JAVA_OPTS="$JAVA_OPTS -Duser.language=pt -Duser.country=BR -Dfile.encoding=ISO-8859-1"

JAVA_OPTS="$JAVA_OPTS -Djava.util.Arrays.useLegacyMergeSort=true -Djboss.node.name=master"

JAVA_OPTS="$JAVA_OPTS -Djboss.modules.system.pkgs=$JBOSS_MODULES_SYSTEM_PKGS -Djava.awt.headless=true "

JAVA_OPTS="$JAVA_OPTS -XX:-OmitStackTraceInFastThrow -Djboss.as.management.blocking.timeout=3600"

JAVA_OPTS="$JAVA_OPTS -XX:+UnlockExperimentalVMOptions -XX:+UseG1GC"

JAVA_OPTS="$JAVA_OPTS -Dcom.arjuna.ats.arjuna.allowMultipleLastResources=true -Dcom.arjuna.ats.coordinator.afterCompletion.reverse.order=false"

JAVA_OPTS="$JAVA_OPTS -Depoll.hang.log=false -Depoll.hang.timeout=180000"

JAVA_OPTS="$JAVA_OPTS -Djava.naming.factory.initial=org.sankhya.wildfly.jndi.NamingInitialContextFactory"

JAVA_OPTS="$JAVA_OPTS -Djava.net.preferIPv4Stack=true -Dsun.security.ssl.allowUnsafeRenegotiation=true"

JAVA_OPTS="$JAVA_OPTS -Djape.cancel.previous.identified.session=false"

JAVA_OPTS="$JAVA_OPTS -Djape.experimental.always.reuse.jdbc.conn=true -Djape.experimental.commit-type=B -Djape.experimental.lock.strategy=1"

JAVA_OPTS="$JAVA_OPTS -Djape.global.query.timeout=600  -Djape.jdbc.check.select=true -Djape.jdbc.monitor.enabled=true"

JAVA_OPTS="$JAVA_OPTS -Djape.jdbc.monitor.kill.thread.wait=10000 -Djape.jdbc.monitor.timeout.tolerance=20000 -Djape.lazy.init=true"

JAVA_OPTS="$JAVA_OPTS -Djape.lob.fields.as.lazy=true -Djape.mysql.lowercase=true -Djape.session.timeout=1800000"

JAVA_OPTS="$JAVA_OPTS -Djape.use.connection.recorder=false"

JAVA_OPTS="$JAVA_OPTS -Djape.use.write.history=false -Dskw.uid-gen.strategy=3"

JAVA_OPTS="$JAVA_OPTS -Dxnio.nio.selector.main=sun.nio.ch.PollSelectorProvider"

JAVA_OPTS="$JAVA_OPTS -Dxnio.nio.selector.temp=sun.nio.ch.PollSelectorProvider"

JAVA_OPTS="$JAVA_OPTS -Dxnio.nio.selector.provider=sun.nio.ch.PollSelectorProvider"

JAVA_OPTS="$JAVA_OPTS -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.PollSelectorProvider"

JAVA_OPTS="$JAVA_OPTS -Djape.sqlserver.use.native.query.getpk=true -Dskw.consulta.produtos.sql_ci_ai=true"

# Sample JPDA settings for remote socket debugging
#JAVA_OPTS="$JAVA_OPTS -agentlib:jdwp=transport=dt_socket,address=8787,server=y,suspend=n"

# Sample JPDA settings for shared memory debugging
#JAVA_OPTS="$JAVA_OPTS -agentlib:jdwp=transport=dt_shmem,server=y,suspend=n,address=jboss"

# Uncomment to not use JBoss Modules lockless mode
#JAVA_OPTS="$JAVA_OPTS -Djboss.modules.lockless=false"

# Uncomment to gather JBoss Modules metrics
#JAVA_OPTS="$JAVA_OPTS -Djboss.modules.metrics=true"

# Uncomment to enable the experimental JDK 11 support for ByteBuddy
# ByteBuddy is the default bytecode provider of Hibernate ORM
#JAVA_OPTS="$JAVA_OPTS -Dnet.bytebuddy.experimental=true"

# Uncomment this to run with a security manager enabled
# SECMGR="true"

# Uncomment this in order to be able to run WildFly on FreeBSD
# when you get "epoll_create function not implemented" message in dmesg output
#JAVA_OPTS="$JAVA_OPTS -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.PollSelectorProvider"

# Uncomment this out to control garbage collection logging
# GC_LOG="true"

# Uncomment and edit to use a custom java.security file to override all the Java security properties
#JAVA_OPTS="$JAVA_OPTS -Djava.security.properties==/path/to/custom/java.security"

# Uncomment to add a Java agent. If an agent is added to the module options, then jboss-modules.jar is added as an agent
# on the JVM. This allows things like the log manager or security manager to be configured before the agent is invoked.
# MODULE_OPTS="-javaagent:agent.jar"
